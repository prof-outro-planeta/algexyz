<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800;900&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>body{margin:0;background:#d6c6b6}[data-theme]{--bg:#e8d8c9;--card:#f5ece2;--ink:#1a1a1a;--shade:#1a1a1a;--navy-t:#4b607f;--stage:#d6c6b6}[data-theme="dark"]{--bg:#161616;--card:#222120;--ink:#e8d8c9;--shade:#4b607f;--navy-t:#8fa7c9;--stage:#0c0c0c}a{color:#4b607f}a:hover{color:#2b3a50}</style>
</helmet>
<div data-theme="{{ theme }}" style="min-height:100vh;box-sizing:border-box;background:var(--stage);display:flex;flex-wrap:wrap;gap:64px;align-items:flex-start;padding:64px;font-family:'Archivo',sans-serif;color:var(--ink)">

  <div style="display:flex;flex-direction:column;gap:12px">
    <span style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em">Feature graphic · 1024×500</span>
    <div data-screen-label="Feature graphic" style="width:1024px;height:500px;box-sizing:border-box;background:var(--bg);border:4px solid var(--ink);position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;padding:48px 56px 48px 48px">
      <div style="display:flex;flex-direction:column;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:4px;font-weight:900;font-size:76px;line-height:1;letter-spacing:-0.03em">
          <span style="background:#4b607f;color:#f5ece2;padding:4px 14px;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--shade)">ALG</span>
          <span style="padding:0 6px">E</span>
          <span style="background:#f3701e;color:#1a1a1a;padding:4px 14px;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--shade)">XYZ</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:20px">
          <div style="font-weight:800;font-size:44px;line-height:1.05;text-transform:uppercase;letter-spacing:-0.01em;text-wrap:balance">{{ tagline }}</div>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <sc-for list="{{ bases }}" as="b" hint-placeholder-count="5">
              <span style="font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:18px;padding:6px 12px;border:3px solid var(--ink);background:var(--card);box-shadow:3px 3px 0 var(--shade)">{{ b }}</span>
            </sc-for>
          </div>
        </div>
      </div>
      <div style="align-self:center;background:var(--card);border:4px solid var(--ink);box-shadow:10px 10px 0 var(--shade);padding:24px;display:flex;flex-direction:column;gap:16px">
        <div style="font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:36px;letter-spacing:0.02em">11010110<sub style="font-size:18px">2</sub></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div style="border:3px solid var(--ink);padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px">
            <span style="font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:24px;letter-spacing:0.08em">1101</span>
            <span style="font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:40px;color:var(--navy-t);line-height:1">D</span>
          </div>
          <div style="border:3px solid var(--ink);padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px">
            <span style="font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:24px;letter-spacing:0.08em">0110</span>
            <span style="font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:40px;color:var(--navy-t);line-height:1">6</span>
          </div>
        </div>
        <div style="background:#f3701e;color:#1a1a1a;border:3px solid var(--ink);padding:10px 14px;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:34px">= D6<sub style="font-size:16px">16</sub></div>
      </div>
    </div>
  </div>

  <div style="display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start">
    <div style="display:flex;flex-direction:column;gap:12px">
      <span style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em">App icon e · 512×512</span>
      <div data-screen-label="App icon e" style="width:512px;height:512px;box-sizing:border-box;background:#e8d8c9;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">
        <div style="background:#4b607f;color:#f5ece2;font-weight:900;font-size:108px;line-height:1;letter-spacing:-0.03em;padding:10px 24px;border:8px solid var(--ink);box-shadow:12px 12px 0 var(--shade);transform:translateX(-28px)">ALG</div>
        <div style="font-weight:900;font-size:76px;line-height:0.9;height:72px;display:flex;align-items:center;font-family:'Archivo',sans-serif">e</div>
        <div style="background:#f3701e;color:#1a1a1a;font-weight:900;font-size:108px;line-height:1;letter-spacing:-0.03em;padding:10px 24px;border:8px solid var(--ink);box-shadow:12px 12px 0 var(--shade);transform:translateX(28px)">XYZ</div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <span style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em">App icon &amp; · 512×512</span>
      <div data-screen-label="App icon &amp;" style="width:512px;height:512px;box-sizing:border-box;background:#e8d8c9;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">
        <div style="background:#4b607f;color:#f5ece2;font-weight:900;font-size:108px;line-height:1;letter-spacing:-0.03em;padding:10px 24px;border:8px solid var(--ink);box-shadow:12px 12px 0 var(--shade);transform:translateX(-28px)">ALG</div>
        <div style="font-weight:900;font-size:76px;line-height:0.9;height:72px;display:flex;align-items:center;font-family:'Archivo',sans-serif">&amp;</div>
        <div style="background:#f3701e;color:#1a1a1a;font-weight:900;font-size:108px;line-height:1;letter-spacing:-0.03em;padding:10px 24px;border:8px solid var(--ink);box-shadow:12px 12px 0 var(--shade);transform:translateX(28px)">XYZ</div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <span style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em">App icon ^ · 512×512</span>
      <div data-screen-label="App icon ^" style="width:512px;height:512px;box-sizing:border-box;background:#e8d8c9;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">
        <div style="background:#4b607f;color:#f5ece2;font-weight:900;font-size:108px;line-height:1;letter-spacing:-0.03em;padding:10px 24px;border:8px solid var(--ink);box-shadow:12px 12px 0 var(--shade);transform:translateX(-28px)">ALG</div>
        <div style="font-weight:900;font-size:76px;line-height:0.9;height:72px;display:flex;align-items:center;font-family:'IBM Plex Mono',monospace;padding-top:28px">^</div>
        <div style="background:#f3701e;color:#1a1a1a;font-weight:900;font-size:108px;line-height:1;letter-spacing:-0.03em;padding:10px 24px;border:8px solid var(--ink);box-shadow:12px 12px 0 var(--shade);transform:translateX(28px)">XYZ</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;language&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Português&quot;,&quot;English&quot;],&quot;default&quot;:&quot;Português&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const en = this.props.language === 'English';
    return {
      theme: this.props.dark ? 'dark' : 'light',
      tagline: en ? 'Number systems, step by step' : 'Sistemas de numeração, passo a passo',
      bases: ['BIN', 'OCT', 'DEC', 'DUO', 'HEX'],
    };
  }
}
</script>
</body>
</html>
